<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Human Verification Console</title>
<style>
:root {
  --bg: #f5f5f5; --card: #fff; --ink: #1a1a1a; --muted: #666;
  --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; --warn: #d97706;
  --border: #e5e5e5; --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6; }
.header { background: var(--ink); color: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 18px; font-weight: 600; }
.header .stats { font-size: 13px; opacity: 0.8; }
.layout { display: flex; height: calc(100vh - 56px); }
.sidebar { width: 280px; background: var(--card); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
.sidebar-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
.sidebar-item:hover { background: #f0f4ff; }
.sidebar-item.active { background: #eff6ff; border-left: 3px solid var(--accent); }
.sidebar-item .ref { font-weight: 600; font-size: 13px; }
.sidebar-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.sidebar-item .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 500; }
.badge-pending { background: #fef3c7; color: #92400e; }
.badge-rejected { background: #fee2e2; color: #991b1b; }
.badge-done { background: #dcfce7; color: #166534; }
.main { flex: 1; overflow-y: auto; padding: 24px; }
.section { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.section h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.section h3 { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
.stem-text { background: #f9fafb; padding: 12px; border-radius: 4px; font-size: 14px; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--border); }
.options-list { display: flex; flex-direction: column; gap: 8px; }
.option-item { display: flex; gap: 8px; padding: 8px 12px; background: #f9fafb; border-radius: 4px; border: 1px solid var(--border); }
.option-label { font-weight: 600; min-width: 24px; color: var(--accent); }
.option-text { flex: 1; word-break: break-word; }
.answer-text { background: #f0fdf4; padding: 12px; border-radius: 4px; border: 1px solid #bbf7d0; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
.raw-lines { font-family: monospace; font-size: 12px; background: #1a1a1a; color: #e5e5e5; padding: 12px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
.raw-lines .line { padding: 2px 0; border-bottom: 1px solid #333; }
.raw-lines .line-ref { color: #60a5fa; margin-right: 8px; }
.gate-reasons { list-style: none; }
.gate-reasons li { padding: 6px 10px; margin: 4px 0; background: #fef2f2; border-left: 3px solid var(--danger); border-radius: 0 4px 4px 0; font-size: 13px; }
.gate-layers { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.layer-card { padding: 8px 12px; border-radius: 4px; font-size: 12px; }
.layer-pass { background: #f0fdf4; border: 1px solid #bbf7d0; }
.layer-fail { background: #fef2f2; border: 1px solid #fecaca; }
.layer-name { font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
.feedback-form { display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 12px; font-weight: 600; color: var(--muted); }
select, textarea { padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 13px; font-family: inherit; }
select { min-width: 200px; }
textarea { min-height: 80px; resize: vertical; width: 100%; }
.btn-row { display: flex; gap: 8px; }
.btn { padding: 8px 16px; border: none; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-warn { background: var(--warn); color: #fff; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--ink); }
.feedback-list { margin-top: 12px; }
.feedback-entry { padding: 10px 12px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 4px; margin: 6px 0; font-size: 13px; }
.feedback-entry .time { font-size: 11px; color: var(--muted); }
.empty-state { text-align: center; padding: 48px; color: var(--muted); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; background: #e5e7eb; margin: 2px; }
.tag-composite { background: #ede9fe; color: #5b21b6; }
.tag-standalone { background: #e0f2fe; color: #075985; }
.latex-preview { padding: 8px 12px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 4px; font-size: 13px; overflow-x: auto; }
</style>
</head>
<body>

<div class="header">
  <h1>Human Verification Console</h1>
  <div class="stats" id="stats"></div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main">
    <div class="empty-state">选择左侧待审题目开始验证</div>
  </div>
</div>

<script>
// Embedded data (loaded from console_data.json)
let DATA = { summary: {}, items: [] };
let currentIndex = -1;
let feedbacks = JSON.parse(localStorage.getItem('hvc_feedbacks') || '{}');

async function loadData() {
  try {
    const resp = await fetch('console_data.json');
    DATA = await resp.json();
  } catch {
    // Fallback: try embedded
    if (typeof CONSOLE_DATA !== 'undefined') DATA = CONSOLE_DATA;
  }
  renderSidebar();
  renderStats();
  if (DATA.items.length > 0) selectItem(0);
}

function renderStats() {
  const s = DATA.summary || {};
  const done = Object.keys(feedbacks).length;
  document.getElementById('stats').textContent =
    `${s.pending_review || 0} pending · ${s.rejected || 0} rejected · ${done} reviewed`;
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = DATA.items.map((item, i) => {
    const isDone = !!feedbacks[item.id];
    const badge = isDone ? 'badge-done' : item.decision_status === 'rejected' ? 'badge-rejected' : 'badge-pending';
    const badgeText = isDone ? '已审' : item.decision_status === 'rejected' ? 'rejected' : 'pending';
    return `
      <div class="sidebar-item ${i === currentIndex ? 'active' : ''}" onclick="selectItem(${i})">
        <div class="ref">${item.question_ref || item.id.slice(0, 8)}</div>
        <div class="meta">
          <span class="badge ${badge}">${badgeText}</span>
          <span class="tag ${item.unit_type === 'composite_unit' ? 'tag-composite' : 'tag-standalone'}">${item.unit_type === 'composite_unit' ? 'composite' : 'standalone'}</span>
        </div>
        <div class="meta" style="margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px;">${(item.stem || '').slice(0, 40)}</div>
      </div>`;
  }).join('');
}

function selectItem(i) {
  currentIndex = i;
  renderSidebar();
  renderItem(DATA.items[i]);
}

function renderItem(item) {
  const main = document.getElementById('main');
  const existing = feedbacks[item.id];

  main.innerHTML = `
    <div class="section">
      <h2>题目信息</h2>
      <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px;">
        <div><strong>Ref:</strong> ${item.question_ref || item.id.slice(0, 12)}</div>
        <div><strong>Status:</strong> <span class="badge ${item.decision_status === 'rejected' ? 'badge-rejected' : 'badge-pending'}">${item.decision_status}</span></div>
        <div><strong>Type:</strong> <span class="tag ${item.unit_type === 'composite_unit' ? 'tag-composite' : 'tag-standalone'}">${item.unit_type}</span></div>
        ${item.material_info?.is_composite ? `<div><strong>Leaves:</strong> ${item.material_info.leaf_count || '?'}</div>` : ''}
      </div>
      ${item.all_refs?.length > 1 ? `<div style="margin-bottom:8px;"><strong>Sub-refs:</strong> ${item.all_refs.map(r => `<span class="tag">${r}</span>`).join('')}</div>` : ''}
    </div>

    <div class="section">
      <h2>Stem（题干）</h2>
      <div class="stem-text">${escapeHtml(item.stem || '(空)')}</div>
      ${item.stem && item.stem.includes('$') ? `<h3>LaTeX 预览</h3><div class="latex-preview">${renderLatexPreview(item.stem)}</div>` : ''}
    </div>

    ${item.options?.length ? `
    <div class="section">
      <h2>Options（选项）</h2>
      <div class="options-list">
        ${item.options.map(o => `
          <div class="option-item">
            <div class="option-label">${escapeHtml(o.label || '?')}</div>
            <div class="option-text">${escapeHtml(o.text || '')}</div>
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <h2>Answer（答案）</h2>
      <div class="answer-text">${escapeHtml(item.answer || '(空)')}</div>
    </div>

    ${item.material_info?.material_text || item.material_info?.figure_refs?.length ? `
    <div class="section">
      <h2>Material / Composite</h2>
      ${item.material_info.material_text ? `<div class="stem-text">${escapeHtml(item.material_info.material_text)}</div>` : ''}
      ${item.material_info.figure_refs?.length ? `<div style="margin-top:8px;">Figure refs: ${item.material_info.figure_refs.map(r => `<span class="tag">${r}</span>`).join('')}</div>` : ''}
      ${item.material_info.leaf_ids?.length ? `<div style="margin-top:8px;">Leaf IDs: ${item.material_info.leaf_ids.map(r => `<span class="tag">${r}</span>`).join('')}</div>` : ''}
    </div>` : ''}

    <div class="section">
      <h2>Pipeline Status & Rejection Reasons</h2>
      <div class="gate-layers" style="margin-bottom:12px;">
        ${Object.entries(item.gate_layers || {}).map(([name, l]) => `
          <div class="layer-card ${l.status === 'pass' ? 'layer-pass' : 'layer-fail'}">
            <div class="layer-name">${name}</div>
            <div>${l.status}</div>
            ${l.reasons?.length ? `<div style="font-size:11px; margin-top:4px;">${l.reasons.slice(0, 2).join('; ')}</div>` : ''}
          </div>
        `).join('')}
      </div>
      ${item.gate_reasons?.length ? `
        <h3>Rejection Reasons</h3>
        <ul class="gate-reasons">
          ${item.gate_reasons.map(r => `<li>${escapeHtml(r)}</li>`).join('')}
        </ul>
      ` : '<p style="color:var(--muted);">无 rejection reasons</p>'}
    </div>

    ${item.raw_lines?.length ? `
    <div class="section">
      <h2>原始证据（Source Lines）</h2>
      <div class="raw-lines">
        ${item.raw_lines.map(l => `
          <div class="line">
            <span class="line-ref">${l.line_ref}</span>
            ${escapeHtml(l.text || '')}
          </div>
        `).join('')}
      </div>
    </div>` : ''}

    <div class="section">
      <h2>人工反馈</h2>
      ${existing ? `
        <div class="feedback-entry">
          <div class="time">${existing.time}</div>
          <div><strong>分类:</strong> ${existing.category}</div>
          <div><strong>结论:</strong> ${existing.conclusion}</div>
          ${existing.note ? `<div><strong>备注:</strong> ${escapeHtml(existing.note)}</div>` : ''}
        </div>
      ` : ''}
      <div class="feedback-form">
        <div class="form-row">
          <div class="form-group">
            <label>问题分类</label>
            <select id="fb-category">
              <option value="">-- 选择分类 --</option>
              <option value="stem_incomplete">stem_incomplete</option>
              <option value="option_incomplete">option_incomplete</option>
              <option value="answer_missing">answer_missing</option>
              <option value="answer_wrong">answer_wrong</option>
              <option value="latex_problem">latex_problem</option>
              <option value="material_missing">material_missing</option>
              <option value="composite_split_problem">composite_split_problem</option>
              <option value="other">other</option>
            </select>
          </div>
          <div class="form-group">
            <label>人工结论</label>
            <select id="fb-conclusion">
              <option value="">-- 选择结论 --</option>
              <option value="accept">accept</option>
              <option value="reject">reject</option>
              <option value="needs_correction">needs_correction</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>备注（可选）</label>
          <textarea id="fb-note" placeholder="简短描述问题..."></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="saveFeedback()">保存反馈</button>
          <button class="btn btn-outline" onclick="exportFeedbacks()">导出 JSON</button>
        </div>
      </div>
    </div>
  `;
}

function saveFeedback() {
  const item = DATA.items[currentIndex];
  if (!item) return;

  const category = document.getElementById('fb-category').value;
  const conclusion = document.getElementById('fb-conclusion').value;
  const note = document.getElementById('fb-note').value.trim();

  if (!category || !conclusion) {
    alert('请选择问题分类和人工结论');
    return;
  }

  feedbacks[item.id] = {
    category,
    conclusion,
    note,
    time: new Date().toISOString(),
    question_ref: item.question_ref,
    decision_status: item.decision_status,
  };

  localStorage.setItem('hvc_feedbacks', JSON.stringify(feedbacks));
  renderSidebar();
  renderStats();
  renderItem(item);

  // Show save confirmation
  const btn = document.querySelector('.btn-primary');
  if (btn) {
    btn.textContent = '✓ 已保存';
    btn.className = 'btn btn-ok';
    setTimeout(() => {
      btn.textContent = '保存反馈';
      btn.className = 'btn btn-primary';
    }, 1500);
  }
}

function exportFeedbacks() {
  const blob = new Blob([JSON.stringify(feedbacks, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hvc_feedbacks.json';
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function renderLatexPreview(text) {
  // Simple LaTeX indication (actual rendering would need KaTeX/MathJax)
  return escapeHtml(text).replace(/\$([^$]+)\$/g, '<code style="background:#fef3c7; padding:1px 4px; border-radius:2px;">$1</code>');
}

loadData();
</script>
</body>
</html>
